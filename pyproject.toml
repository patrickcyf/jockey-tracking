[tool.black]
line-length = 79
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | datasets
  | runs
  | build
  | dist
  | venv
  | \.env
  | \.flake8
)/
'''

[tool.isort]
atomic = true
profile = "black"
line_length = 79
skip_gitignore = true