[project]
name = "jockey-tracking"
version = "0.1.0"
description = "Detect and track individual jockey in race meeting"
requires-python = ">=3.12"
authors = [
    {name = "Patrick Cheung", email = "patrickcyf@gmail.com"},
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "ultralytics>=8.3.208",
    "supervision>=0.26.1",
    "easyocr>=1.7.2",
]

[tool.black]
line-length = 79
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | datasets
  | runs
  | build
  | dist
  | venv
  | \.env
  | \.flake8
)/
'''

[tool.isort]
atomic = true
profile = "black"
line_length = 79
skip_gitignore = true

[tool.flake8]
exclude = [".git", "__pycache__", "build", "dist"]
max-line-length = 79
max-complexity = 10
# Extend the ignored error codes to avoid conflicts.
# E203 (whitespace before ':') conflicts with Black's slicing format.
# E501 (line too long) is covered by Black's formatting and Bugbear's B950 check.
# W503 (line break before binary operator) is how Black formats.
extend-ignore = ["E203", "E501", "W503"]

[tool.pylint.main]
source-roots = ["."]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.4",
    "isort>=5.13.2",
    "pre-commit>=4.5.1",
    "pylint>=4.0.4",
    "pylint-actions>=0.4.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
